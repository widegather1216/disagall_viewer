<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디시 사진 뷰어 설정</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .header-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .guide-step {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 6px;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .guide-step:last-child {
      margin-bottom: 0;
    }

    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .setting-label {
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .setting-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-color);
    }

    input[type="range"] {
      width: 100%;
      margin-top: 8px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </div>
    <div>
      <div class="header-title">디시 사진 뷰어</div>
      <div class="header-sub">디지털 사진 갤러리 맞춤 원본 감상기</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      💡 사용 방법 & 제스처
    </div>
    <div class="guide-step">
      <span class="badge">1</span>
      사진 우클릭 ➔ <b>"📷 디시 사진 뷰어로 화면 맞춤 보기"</b> 선택
    </div>
    <div class="guide-step">
      <span class="badge">2</span>
      <b>← / → 방향키</b>로 이전/다음 사진 이동
    </div>
    <div class="guide-step">
      <span class="badge">3</span>
      <b>마우스 휠 / 트랙패드</b>로 사진 자유 확대/축소 & <b>드래그</b> 이동
    </div>
    <div class="guide-step">
      <span class="badge">4</span>
      <b>상단 슬라이더</b>로 화면 전체 여백(패딩) 조절 (더블클릭 리셋)
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      ⚙️ 기본 여백(패딩) 설정
    </div>
    <div class="setting-row">
      <span class="setting-label">뷰어 여백 크기</span>
      <span class="setting-val" id="padding-val">24px</span>
    </div>
    <input type="range" id="padding-slider" min="0" max="100" value="24">
  </div>

  <div class="footer">
    Disagall Viewer v1.0.0 • 화면 맞춤 & 원본 화질 보충
  </div>

  <script src="popup.js"></script>
</body>
</html>
